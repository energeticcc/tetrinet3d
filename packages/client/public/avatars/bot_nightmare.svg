    <ellipse cx="56" cy="50" rx="6" ry="8" fill="#e6ccff"/>
  </g>
  <!-- deep frown -->
  <path d="M38 66 Q48 60 58 66" fill="none" stroke="#0c0618" stroke-width="3" stroke-linecap="round"/>
  <!-- 5 difficulty pips -->
  <circle cx="30" cy="84" r="2.6" fill="#b06bff"/>
